apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-base-routing
spec:
  ingressClassName: nginx
  rules:
    - host: app-1.myexample.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myexample-web
                port:
                  number: 80

    - host: app-2.myexample.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myexample-web
                port:
                  number: 80